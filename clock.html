<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./clock.css">
    <title>Clock</title>
</head>

<body>
    <div class="Circle">
        <video src="./clockbg.mp4" autoplay muted loop></video>


        <div class="clock-items" id="top">12</div>
        <div class="clock-items" id="right">3</div>
        <div class="clock-items" id="bottom">6</div>
        <div class="clock-items" id="left">9</div>
        <div class="clock-items" id="center"> </div>
        <div class="clock-items" id="hour"></div>
        <div class="clock-items" id="minute"></div>
        <div class="clock-items" id="second"></div>

    </div>

</body>

</html>
